AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda function and IAM role for Learning Notes API

Parameters:
  FunctionName:
    Type: String
    Default: LearningNotesHandler
    Description: Lambda function name

  TableName:
    Type: String
    Description: DynamoDB table name (from database stack)

  S3Bucket:
    Type: String
    Description: S3 bucket where the Lambda deployment package is stored

  S3Key:
    Type: String
    Description: Key (path) of the Lambda zip file in the S3 bucket

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-ExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"

  LearningNotesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Learning Notes Lambda
    Value: !GetAtt LearningNotesFunction.Arn
  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref LearningNotesFunction
