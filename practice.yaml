AWSTemplateFormatVersion: "2010-09-09"
Description: Simple Lambda function example

Resources:
  MyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  MyLambdaFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: HelloLambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt MyLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              print("Hello from Lambda!")
              return {
                  'statusCode': 200,
                  'body': json.dumps('Lambda executed successfully!')
              }
  MyRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: HelloApi
      Description: Simple API connected to Lambda

  HelloResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MyRestApi
      ParentId: !GetAtt MyRestApi.RootResourceId
      PathPart: hello

  GetHelloMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MyRestApi
      ResourceId: !Ref HelloResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MyLambdaFunction.Arn}/invocations

  LambdaPermissionForApi:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MyLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MyRestApi}/*/*

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: GetHelloMethod
    Properties:
      RestApiId: !Ref MyRestApi
      StageName: prod

Outputs:
  ApiUrl:
    Value: !Sub "https://${MyRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/hello"
